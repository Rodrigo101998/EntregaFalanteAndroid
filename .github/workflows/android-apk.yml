name: Build Entrega Falante APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Extract Android project
        run: |
          unzip -o EntregaFalanteAndroid_v10.zip
          test -f EntregaFalanteAndroid_v9/settings.gradle.kts
          cp -a EntregaFalanteAndroid_v9/. .

      - uses: actions/setup-java@v4
        with:
         distribution: temurin
         java-version: '17'

      - uses: android-actions/setup-android@v3
        with:
          packages: |
            platform-tools
            platforms;android-35
            build-tools;35.0.0

      - uses: gradle/actions/setup-gradle@v4
        with:
         gradle-version: '8.9'
      - name: Build APK
        run: gradle --no-daemon assembleDebug

      - uses: actions/upload-artifact@v4
        with:
          name: EntregaFalante-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
